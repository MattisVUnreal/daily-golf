<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hole of the Day Course Guide</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Layout: one band per week, Monday→Sunday, so the weekly difficulty rhythm reads left to right. */
    :root {
      --bg: #b9f0dd; --bg2: #d9f7ec; --card: #ffffff; --ink: #1f3b33; --ink-2: #4f6f65;
      --line: #cfe8dc; --gold: #ffb703; --green: #2bb673; --pink: #ff3b5c;
      --display: 'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: linear-gradient(var(--bg), var(--bg2)) fixed; color: var(--ink); font-family: var(--display); }
    .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; }
    header h1 { font-size: clamp(28px, 6vw, 44px); margin: 0; text-wrap: balance; }
    header p { color: var(--ink-2); font-size: 16px; margin: 6px 0 0; max-width: 62ch; line-height: 1.4; }
    .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .summary span { background: var(--card); border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
    .week { margin-top: 28px; }
    .week h2 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .week h2 small { font-size: 13px; color: var(--ink-2); font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .pad { display: none; } }
    @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .hole {
      display: flex; flex-direction: column; background: var(--card); border-radius: 16px; overflow: hidden;
      text-decoration: none; color: inherit; box-shadow: 0 3px 0 var(--line); transition: transform 0.12s;
    }
    .hole:hover, .hole:focus-visible { transform: translateY(-3px); outline: none; box-shadow: 0 3px 0 var(--line), 0 0 0 3px var(--green); }
    .hole canvas { width: 100%; aspect-ratio: 10 / 13; display: block; max-width: 100%; }
    .meta { padding: 8px 10px 10px; display: grid; gap: 3px; }
    .when { font-size: 12px; color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 6px; }
    .name { font-size: 15px; font-weight: 700; line-height: 1.15; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
    .par { background: #eef8f3; border-radius: 99px; padding: 1px 8px; }
    .meter { display: flex; gap: 3px; }
    .meter i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
    .meter i.on { background: var(--pink); }
    .tag { font-size: 11px; color: #5b2ca8; background: #e9defc; border-radius: 99px; padding: 1px 7px; justify-self: start; }
    .today { box-shadow: 0 3px 0 var(--line), 0 0 0 3px var(--gold); }
    .play { font-size: 12px; color: var(--green); font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { .hole { transition: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>⛳ Course Guide</h1>
      <p>Every hole in the first 9-week cycle, in the order they come up. Monday is the easiest day and the weekend is the hardest. Tap a hole to play it as a preview (it won't count toward your stats).</p>
      <div class="summary" id="summary"></div>
    </header>
    <main id="weeks"></main>
  </div>

  <script src="js/vendor/planck.min.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/holes.js"></script>
  <script src="js/render.js"></script>
  <script src="js/daily.js"></script>
  <script>
    (function () {
      const { phys: P, daily: D, Renderer } = window.HOTD;
      const PLAY_BASE = window.PLAY_BASE || 'index.html';
      const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const fmt = d => `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;
      const today = D.dayIndex();
      const launchWd = (D.dateOfDay(0).getUTCDay() + 6) % 7;
      const TOTAL = 63 - launchWd; // the rest of the first cycle

      const pars = {};
      HOTD.HOLES.forEach(h => { pars[h.par] = (pars[h.par] || 0) + 1; });
      document.getElementById('summary').innerHTML =
        `<span>${HOTD.HOLES.length} holes</span>` +
        Object.keys(pars).sort().map(p => `<span>${pars[p]} × par ${p}</span>`).join('');

      const weeks = document.getElementById('weeks');
      const jobs = [];
      let grid = null;
      for (let d = 0; d < TOTAL; d++) {
        const date = D.dateOfDay(d), wd = (date.getUTCDay() + 6) % 7;
        if (!grid || wd === 0) {
          const start = D.dateOfDay(d - wd), end = D.dateOfDay(d - wd + 6);
          const sec = document.createElement('section');
          sec.className = 'week';
          sec.innerHTML = `<h2>Week ${Math.floor((d + launchWd) / 7) + 1} <small>${fmt(start)} – ${fmt(end)}</small></h2><div class="grid"></div>`;
          weeks.appendChild(sec);
          grid = sec.querySelector('.grid');
          for (let k = 0; k < wd; k++) { const pad = document.createElement('div'); pad.className = 'pad'; grid.appendChild(pad); }
        }
        const info = D.holeForDay(d), h = info.hole;
        const dots = Math.max(1, Math.min(5, Math.round(h.d / 2)));
        const a = document.createElement('a');
        a.className = 'hole' + (d === today ? ' today' : '');
        a.href = `${PLAY_BASE}#hole${d + 1}`;
        a.target = window.PLAY_BASE ? '_blank' : '';
        a.innerHTML = `<canvas></canvas><div class="meta">
          <div class="when"><span>#${d + 1}</span><span>${DAYS[wd]} ${fmt(date)}</span></div>
          <div class="name">${h.n}</div>
          <div class="row"><span class="par">Par ${h.par}</span><span class="meter" title="Difficulty ${dots} of 5">${'<i class="on"></i>'.repeat(dots)}${'<i></i>'.repeat(5 - dots)}</span></div>
          ${info.mirror ? '<span class="tag">Mirrored repeat</span>' : ''}
          ${d === today ? '<span class="play">Today’s hole</span>' : ''}
        </div>`;
        grid.appendChild(a);
        jobs.push([a.querySelector('canvas'), info]);
      }

      function drawAll() {
        for (const [cv, info] of jobs) {
          const r = new Renderer(cv);
          r.insetTop = 0; r.insetBottom = 0;
          const course = P.buildCourse(info.hole, info.mirror);
          r.course = course;
          r.resize();
          const sim = new P.Sim(course);
          r.draw({ t: 0.4, sim, ball: { x: course.tee.x, y: course.tee.y, visible: true, scale: 1 }, skinId: 'classic', flagUp: 1 });
        }
      }
      drawAll();
      let rt = 0;
      window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawAll, 150); });
    })();
  </script>
</body>
</html>
